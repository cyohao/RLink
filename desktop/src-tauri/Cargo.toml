[package]
name = "ruilink"
version = "1.0.1"
description = "瑞联（桌面版）"
edition = "2021"

[lib]
name = "ruilink"
path = "src/lib.rs"

[[bin]]
name = "ruilink"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
encoding_rs = "0.8"
flate2 = "1"
brotli-decompressor = "4"
url = "2"
percent-encoding = "2"
form_urlencoded = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
include_dir = "0.7"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
